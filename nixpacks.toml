[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo_mysql", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.gd", "php84Extensions.zip", "php84Extensions.bcmath", "php84Extensions.intl", "php84Extensions.exif", "php84Extensions.opcache", "nginx"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
